<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#cbb89d">

<title>Bali Retreat 2026 · Ubud Walking Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --beige:#f5eee3;
  --cream:#fffaf3;
  --brown:#55483c;
  --green:#71816a;
  --gold:#b79b6b;
  --border:#dfd1bd;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--beige);
  color:var(--brown);
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:27px 16px 19px;
  background:linear-gradient(145deg,#f8f0e5,#e9dcc9);
  border-bottom:1px solid var(--border);
}

.flower{
  font-size:25px;
  margin-bottom:4px;
}

h1{
  margin:0;
  font-family:Georgia,serif;
  font-weight:normal;
  font-size:31px;
}

.subtitle{
  margin-top:7px;
  color:var(--green);
  font-size:13px;
  letter-spacing:1px;
}

.brand{
  margin-top:9px;
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:15px;
  letter-spacing:.7px;
  font-weight:bold;
}

.intro{
  text-align:center;
  padding:13px 18px;
  background:var(--cream);
  font-family:Georgia,serif;
  font-style:italic;
  color:#766858;
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:10px 12px;
  background:var(--cream);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.filters button{
  flex-shrink:0;
  border:1px solid #d5c4ad;
  background:white;
  color:var(--brown);
  border-radius:22px;
  padding:8px 13px;
  font-size:12px;
}

.filters button.active{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.map-wrap{
  position:relative;
  margin:14px;
}

#map{
  height:58vh;
  min-height:430px;
  border-radius:22px;
  border:1px solid #d6c6b0;
  overflow:hidden;
  box-shadow:0 7px 25px #55483c22;
}

.location-btn{
  position:absolute;
  right:12px;
  top:12px;
  z-index:1000;
  border:0;
  background:#fffaf4;
  color:var(--brown);
  padding:11px 14px;
  border-radius:18px;
  box-shadow:0 3px 12px #55483c33;
  font-size:12px;
}

.leaflet-popup-content-wrapper{
  border-radius:15px;
}

.popup{
  min-width:210px;
}

.popup h3{
  margin:0 0 5px;
  font-family:Georgia,serif;
  font-size:17px;
}

.popup .cat{
  color:var(--green);
  font-size:11px;
  margin-bottom:8px;
}

.popup p{
  font-size:12px;
  line-height:1.45;
  margin:7px 0;
}

.walk{
  color:var(--green);
  font-weight:bold;
  font-size:12px;
}

.nav-btn{
  display:block;
  text-align:center;
  margin-top:10px;
  padding:9px;
  border-radius:10px;
  background:var(--green);
  color:white !important;
  text-decoration:none;
  font-size:12px;
}

.cards{
  padding:0 14px 30px;
}

.card{
  background:#fffdf9;
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:0 3px 12px #55483c10;
}

.card-head{
  display:flex;
  gap:10px;
  align-items:center;
}

.emoji{
  font-size:25px;
}

.name{
  font-family:Georgia,serif;
  font-size:17px;
}

.category{
  color:var(--green);
  font-size:11px;
  margin-top:2px;
}

.description{
  margin:8px 0;
  font-size:13px;
  line-height:1.45;
  color:#6c6257;
}

.buttons{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.buttons button,
.buttons a{
  flex:1;
  text-align:center;
  padding:9px 6px;
  border-radius:10px;
  font-size:12px;
  text-decoration:none;
}

.show{
  border:1px solid #d7c7b0;
  background:#f7efe4;
  color:var(--brown);
}

.navigate{
  background:var(--green);
  color:white;
}

footer{
  text-align:center;
  padding:20px;
  font-size:11px;
  line-height:1.5;
  color:#817566;
}
</style>
</head>

<body>

<header>
  <div class="flower">🌺</div>

  <h1>Bali Retreat 2026</h1>

  <div class="subtitle">
    MAPA SPACEROWA · UBUD
  </div>

  <div class="brand">
    JOGOWE WYJAZDY W NIEMCZECH
  </div>
</header>

<div class="intro">
  Wszystko, co najważniejsze — na piechotę z Krishna House ♡
</div>

<div class="filters" id="filters"></div>

<div class="map-wrap">

  <button class="location-btn" onclick="findMe()">
    📍 Moja lokalizacja
  </button>

  <div id="map"></div>

</div>

<div class="cards" id="cards"></div>

<footer>
  <strong>JOGOWE WYJAZDY W NIEMCZECH</strong><br>
  Bali Retreat 2026 · Ubud<br><br>
  © OpenStreetMap contributors
</footer>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const places = [

{
 id:"hotel",
 name:"Krishna House",
 category:"🏨 Baza",
 emoji:"🏨",
 lat:-8.51245,
 lon:115.26565,
 walk:"Wasza baza",
 desc:"Jl. Jembawan No. 9B, Ubud, Bali 80571"
},

{
 id:"saraswati",
 name:"Pura Taman Saraswati",
 category:"🌸 Świątynie",
 emoji:"🌸",
 lat:-8.50611,
 lon:115.26169,
 walk:"ok. 10–15 min",
 desc:"Piękna świątynia z lotosowym stawem w centrum Ubud."
},

{
 id:"palace",
 name:"Ubud Palace",
 category:"👑 Świątynie",
 emoji:"👑",
 lat:-8.50672,
 lon:115.26271,
 walk:"ok. 10–15 min",
 desc:"Pałac królewski Ubud."
},

{
 id:"market",
 name:"Ubud Art Market",
 category:"🧺 Zakupy",
 emoji:"🧺",
 lat:-8.50642,
 lon:115.26218,
 walk:"ok. 10–15 min",
 desc:"Tradycyjny bazar z rękodziełem, sarongami i pamiątkami."
},

{
 id:"lukisan",
 name:"Museum Puri Lukisan",
 category:"🎨 Sztuka",
 emoji:"🎨",
 lat:-8.50520,
 lon:115.26027,
 walk:"ok. 10–15 min",
 desc:"Muzeum balijskiej sztuki i malarstwa."
},

{
 id:"campuhan",
 name:"Campuhan Ridge Walk",
 category:"🌿 Natura",
 emoji:"🌿",
 lat:-8.50361,
 lon:115.25470,
 walk:"ok. 20–25 min do wejścia",
 desc:"Piękny spacer grzbietem wzgórza."
},

{
 id:"kajeng",
 name:"Kajeng Rice Fields",
 category:"🌾 Natura",
 emoji:"🌾",
 lat:-8.50390,
 lon:115.26680,
 walk:"ok. 10–15 min",
 desc:"Spokojny spacer przez pola ryżowe."
},

{
 id:"monkey",
 name:"Sacred Monkey Forest",
 category:"🐒 Natura",
 emoji:"🐒",
 lat:-8.51892,
 lon:115.25867,
 walk:"ok. 20–25 min",
 desc:"Las, świątynie i małpy."
},

{
 id:"coco",
 name:"Coco Supermarket",
 category:"🛒 Zakupy",
 emoji:"🛒",
 lat:-8.51710,
 lon:115.26295,
 walk:"ok. 10–15 min",
 desc:"Woda, owoce, przekąski i rzeczy codziennego użytku."
},

{
 id:"blanco",
 name:"Blanco Renaissance Museum",
 category:"🖼️ Sztuka",
 emoji:"🖼️",
 lat:-8.50690,
 lon:115.25610,
 walk:"ok. 20–25 min",
 desc:"Muzeum sztuki w charakterystycznym domu na wzgórzu."
},

{
 id:"arma",
 name:"ARMA Museum",
 category:"🪷 Sztuka",
 emoji:"🪷",
 lat:-8.52200,
 lon:115.26540,
 walk:"ok. 25–30 min",
 desc:"Muzeum sztuki balijskiej w zielonym kompleksie."
},

{
 id:"taman",
 name:"Pura Dalem Taman Kaja",
 category:"🔥 Kultura",
 emoji:"🔥",
 lat:-8.506313,
 lon:115.265367,
 walk:"ok. 15–20 min od Saraswati",
 desc:"Miejsce Kecak & Fire Dance. Wasz plan: środa 7.10.2026."
}

];


const categories={
 "Wszystko":"✨",
 "Baza":"🏨",
 "Natura":"🌿",
 "Świątynie":"🛕",
 "Kultura":"🔥",
 "Sztuka":"🎨",
 "Zakupy":"🛍️"
};


let activeCategory="Wszystko";


// PRAWDZIWA MAPA UBUD
const map=L.map("map",{
 zoomControl:true
}).setView([-8.5105,115.2625],15);


// OpenStreetMap
L.tileLayer(
 "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
   maxZoom:19,
   attribution:
   '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
 }
).addTo(map);


const markers={};


function googleMaps(place){

 return "https://www.google.com/maps/dir/?api=1"
 +"&destination="+place.lat+","+place.lon
 +"&travelmode=walking";

}


function icon(place){

 let border="#71816a";

 if(place.id==="hotel") border="#b79b6b";

 if(place.id==="taman") border="#b76b50";

 return L.divIcon({

   className:"custom-marker",

   html:
   `<div style="
      width:40px;
      height:40px;
      border-radius:50%;
      background:#fffaf3;
      border:3px solid ${border};
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      box-shadow:0 3px 10px #55483c55;
   ">${place.emoji}</div>`,

   iconSize:[40,40],
   iconAnchor:[20,20]

 });

}


function popup(place){

 return `
 <div class="popup">

   <h3>${place.emoji} ${place.name}</h3>

   <div class="cat">
     ${place.category}
   </div>

   <p>
     ${place.desc}
   </p>

   <div class="walk">
     🚶 ${place.walk}
   </div>

   <a
     class="nav-btn"
     href="${googleMaps(place)}"
     target="_blank">

     🧭 Prowadź mnie w Google Maps

   </a>

 </div>
 `;

}


function addMarkers(){

 Object.values(markers).forEach(m=>{
   map.removeLayer(m);
 });

 Object.keys(markers).forEach(k=>delete markers[k]);

 places
 .filter(p=>
   activeCategory==="Wszystko" ||
   p.category.includes(activeCategory)
 )
 .forEach(place=>{

   const marker=L.marker(
     [place.lat,place.lon],
     {icon:icon(place)}
   ).addTo(map);

   marker.bindPopup(popup(place));

   markers[place.id]=marker;

 });

}


function createFilters(){

 const box=document.getElementById("filters");

 box.innerHTML="";

 Object.keys(categories).forEach(category=>{

   const button=document.createElement("button");

   button.textContent=
     categories[category]+" "+category;

   if(category===activeCategory)
     button.classList.add("active");

   button.onclick=()=>{

     activeCategory=category;

     createFilters();
     addMarkers();
     renderCards();

   };

   box.appendChild(button);

 });

}


function renderCards(){

 const box=document.getElementById("cards");

 box.innerHTML="";

 places
 .filter(p=>
   activeCategory==="Wszystko" ||
   p.category.includes(activeCategory)
 )
 .forEach(place=>{

   const card=document.createElement("div");

   card.className="card";

   card.innerHTML=`

     <div class="card-head">

       <div class="emoji">
         ${place.emoji}
       </div>

       <div>

         <div class="name">
           ${place.name}
         </div>

         <div class="category">
           ${place.category}
         </div>

       </div>

     </div>

     <div class="description">
       ${place.desc}
     </div>

     <div class="walk">
       🚶 ${place.walk}
     </div>

     <div class="buttons">

       <button
         class="show"
         onclick="showPlace('${place.id}')">

         Pokaż na mapie

       </button>

       <a
         class="navigate"
         href="${googleMaps(place)}"
         target="_blank">

         Nawiguj →

       </a>

     </div>
   `;

   box.appendChild(card);

 });

}


function showPlace(id){

 const place=places.find(p=>p.id===id);

 if(!place)return;

 map.setView(
   [place.lat,place.lon],
   16,
   {animate:true}
 );

 markers[id].openPopup();

 document.getElementById("map")
 .scrollIntoView({
   behavior:"smooth",
   block:"center"
 });

}


let myLocationMarker=null;


function findMe(){

 if(!navigator.geolocation){

   alert(
    "Twoja przeglądarka nie obsługuje GPS."
   );

   return;

 }

 navigator.geolocation.getCurrentPosition(

   position=>{

     const lat=position.coords.latitude;
     const lon=position.coords.longitude;

     if(myLocationMarker)
       map.removeLayer(myLocationMarker);

     myLocationMarker=
       L.circleMarker(
         [lat,lon],
         {
           radius:9,
           color:"#b76b50",
           fillColor:"#b76b50",
           fillOpacity:.85,
           weight:3
         }
       ).addTo(map);

     myLocationMarker
       .bindPopup("📍 Twoja aktualna lokalizacja")
       .openPopup();

     map.setView(
       [lat,lon],
       16
     );

   },

   error=>{

     alert(
       "Nie udało się pobrać lokalizacji. " +
       "Sprawdź, czy lokalizacja jest włączona " +
       "i zezwól stronie na dostęp do GPS."
     );

   },

   {
     enableHighAccuracy:true,
     timeout:15000,
     maximumAge:0
   }

 );

}


createFilters();
addMarkers();
renderCards();

</script>

</body>
</html>
