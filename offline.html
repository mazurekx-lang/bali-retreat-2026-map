*{

.offline{

  font-size:11px;
}

.intro{

}

.status{

  text-align:center;
}

.cards{
  padding:0 14px 30px;

.card{

  padding:14px;
  margin-bottom:10px;
}

.name{

  font-size:17px;
}

.category{

  font-size:11px;
  margin-top:3px;

.description{

  font-size:13px;
  line-height:1.45;
  color:#6c6257;
}

.walk{
  color:var(--green);
  font-weight:bold;
  font-size:12px;
}

button,
a{
  display:block;
  width:100%;
  margin-top:9px;
  padding:10px;
  border-radius:10px;
  border:0;
  text-align:center;
  text-decoration:none;
  font-size:12px;
}

.show{
  background:#f7efe4;
  color:var(--brown);
  border:1px solid #d7c7b0;
}

.navigate{
  background:var(--green);
  color:white;
}

footer{
  text-align:center;
  padding:20px;
  font-size:11px;
  color:#817566;
}

</style>
