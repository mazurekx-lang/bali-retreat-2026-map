<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bali Retreat 2026 · Offline Map</title>

<link rel="stylesheet"
href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css">

<script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>

<style>
.category-icon {
  width: 26px;
  height: 26px;
  object-fit: contain;
  vertical-align: middle;
  margin-right: 6px;
}
:root{
  --beige:#f5eee3;
  --cream:#fffaf3;
  --brown:#55483c;
  --green:#71816a;
  --gold:#b79b6b;
  --border:#dfd1bd;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--beige);
  color:var(--brown);
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:27px 16px 19px;
  background:linear-gradient(145deg,#f8f0e5,#e9dcc9);
  border-bottom:1px solid var(--border);
}

.flower{
    width:55px;
    height:55px;
    margin:0 auto 8px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.flower::before{
    content:none !important;
}

.flower img{
    width:55px !important;
    height:55px !important;
    max-width:55px !important;
    max-height:55px !important;
    object-fit:contain !important;
    display:block !important;
}
  
h1{
  margin:0;
  font-family:Georgia,serif;
  font-weight:normal;
  font-size:31px;
}

.subtitle{
  margin-top:7px;
  color:var(--green);
  font-size:13px;
  letter-spacing:1px;
}

.brand{
  margin-top:9px;
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:15px;
  font-weight:bold;
}

.intro{
  text-align:center;
  padding:13px 18px;
  background:var(--cream);
  font-family:Georgia,serif;
  font-style:italic;
  color:#766858;
}

.offline-note{
  text-align:center;
  padding:9px;
  background:#71816a;
  color:white;
  font-size:12px;
}

.map-wrap{
  position:relative;
  margin:14px;
}

#map{
  height:58vh;
  min-height:430px;
  border-radius:22px;
  border:1px solid #d6c6b0;
  overflow:hidden;
  box-shadow:0 7px 25px #55483c22;
}

.location-btn{
  position:absolute;
  right:12px;
  top:12px;
  z-index:1000;
  border:0;
  background:#fffaf4;
  color:var(--brown);
  padding:11px 14px;
  border-radius:18px;
  box-shadow:0 3px 12px #55483c33;
  font-size:12px;
}

.loading{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:900;
  background:#fffaf3;
  padding:15px 20px;
  border-radius:15px;
  box-shadow:0 3px 15px #55483c33;
  font-size:13px;
}

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:10px 12px;
  background:var(--cream);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.filters button{
  flex-shrink:0;
  border:1px solid #d5c4ad;
  background:white;
  color:var(--brown);
  border-radius:22px;
  padding:8px 13px;
  font-size:12px;
}

.filters button.active{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.cards{
  padding:0 14px 30px;
}

.card{
    background:#fffdf9;
    border:1px solid #e6dcc9;
    border-radius:20px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 4px 18px rgba(85,72,60,0.10);
}

.card-head{
  display:flex;
  gap:10px;
  align-items:center;
}

.emoji{
    width:40px;
    min-width:40px;
    font-size:25px;
    display:flex;
    align-items:center;
    justify-content:center;
}
  font-size:25px;
}

.name{
  font-family:Georgia,serif;
  font-size:17px;
}

.category{
  color:var(--green);
  font-size:11px;
  margin-top:2px;
}

.description{
  margin:8px 0;
  font-size:13px;
  line-height:1.45;
  color:#6c6257;
}

.walk{
  color:var(--green);
  font-weight:bold;
  font-size:12px;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:10px;
  flex-wrap:wrap;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:10px;
  justify-content:flex-start;
  flex-wrap:wrap;
}

.show{
  border:1px solid #d8cbb8;
  background:#fffdf9;
  color:var(--brown);
}

.navigate{
  background:var(--green);
  color:white;
  border:1px solid var(--green);
}

footer{
  text-align:center;
  padding:20px;
  font-size:11px;
  line-height:1.5;
  color:#817566;
}

</style>
</head>

<body>

<header>

<div class="flower">
  <img src="bali_icons/kwiat-tytul.png" alt="">
</div>
<h1>Bali Retreat 2026</h1>

<div class="subtitle">
MAPA SPACEROWA · UBUD
</div>

<div class="brand">
JOGOWE WYJAZDY W NIEMCZECH
</div>

</header>

<div class="offline-note">
📱 MAPA OFFLINE · DANE MAPY ZAPISANE LOKALNIE
</div>

<div class="intro">
Wszystko, co najważniejsze — na piechotę z Krishna House ♡
</div>

<div class="filters" id="filters"></div>

<div class="map-wrap">

<button class="location-btn" onclick="findMe()">
📍 Moja lokalizacja
</button>

<div id="map"></div>

<div class="loading" id="loading">
🔄 Ładowanie lokalnej mapy...
</div>

</div>

<div class="cards" id="cards"></div>

<footer>

<strong>JOGOWE WYJAZDY W NIEMCZECH</strong><br>
Bali Retreat 2026 · Ubud<br><br>
© OpenStreetMap contributors

</footer>


<script>

const places = [

{
id:"hotel",
name:"Krishna House",
category:"🏨 Baza",
emoji:"🏨",
lat:-8.51245,
lon:115.26565,
walk:"Nasza baza",
desc:"Jl. Jembawan No. 9B, Ubud, Bali 80571"
},

{
id:"saraswati",
name:"Pura Taman Saraswati",
icon:"swietynie.png",
category:"🌸 Świątynie",
emoji:"🌸",
lat:-8.50611,
lon:115.26169,
walk:"ok. 10–15 min",
desc:"Piękna świątynia z lotosowym stawem w centrum Ubud."
},

{
id:"palace",
name:"Ubud Palace",
icon:"ubud_palace_icon.png",
category:"👑 Świątynie",
emoji:"👑",
  
lat:-8.50672,
lon:115.26271,
walk:"ok. 10–15 min",
desc:"Pałac królewski Ubud."
},

{
id:"market",
name:"Ubud Art Market",
category:"🧺 Zakupy",
emoji:"🧺",
lat:-8.50642,
lon:115.26218,
walk:"ok. 10–15 min",
desc:"Tradycyjny bazar z rękodziełem, sarongami i pamiątkami."
},

{
id:"lukisan",
name:"Museum Puri Lukisan",
category:"🎨 Sztuka",
emoji:"🎨",
lat:-8.50520,
lon:115.26027,
walk:"ok. 10–15 min",
desc:"Muzeum balijskiej sztuki i malarstwa."
},

{
id:"campuhan",
name:"Campuhan Ridge Walk",
category:"🌿 Natura",
emoji:"🌿",
lat:-8.50361,
lon:115.25470,
walk:"ok. 20–25 min do wejścia",
desc:"Piękny spacer grzbietem wzgórza."
},

{
id:"kajeng",
name:"Kajeng Rice Fields",
category:"🌾 Natura",
emoji:"🌾",
lat:-8.50390,
lon:115.26680,
walk:"ok. 10–15 min",
desc:"Spokojny spacer przez pola ryżowe."
},

{
id:"monkey",
name:"Sacred Monkey Forest",
category:"🐒 Natura",
emoji:"🐒",
icon:"monkey_forest_icon.png",
lat:-8.51892,
lon:115.25867,
walk:"ok. 20–25 min",
desc:"Las, świątynie i małpy."
},

{
id:"coco",
name:"Coco Supermarket",
category:"🛒 Zakupy",
emoji:"🛒",
lat:-8.51710,
lon:115.26295,
walk:"ok. 10–15 min",
desc:"Woda, owoce, przekąski i rzeczy codziennego użytku."
},

{
id:"blanco",
name:"Blanco Renaissance Museum",
category:"🖼️ Sztuka",
emoji:"🖼️",
lat:-8.50690,
lon:115.25610,
walk:"ok. 20–25 min",
desc:"Muzeum sztuki w charakterystycznym domu na wzgórzu."
},

{
id:"arma",
name:"ARMA Museum",
category:"🪷 Sztuka",
emoji:"🪷",
lat:-8.52200,
lon:115.26540,
walk:"ok. 25–30 min",
desc:"Muzeum sztuki balijskiej w zielonym kompleksie."
},

{
id:"taman",
name:"Pura Dalem Taman Kaja",
category:"🔥 Kultura",
emoji:"🔥",
lat:-8.506313,
lon:115.265367,
walk:"ok. 15–20 min od Saraswati",
desc:"Miejsce Kecak & Fire Dance. Wasz plan: środa 7.10.2026."
}

];


const categories={

"Wszystko":"✨",
"Baza":"🏨",
"Natura":"🌿",
"Świątynie":"🛕",
"Kultura":"🔥",
"Sztuka":"🎨",
"Zakupy":"🛍️"

};


let activeCategory="Wszystko";

var map;
let markers={};
let myLocationMarker=null;
let activePopup=null;


/* =====================================
   PMTILES — LOKALNY PLIK
===================================== */

const PMTILES_URL =
new URL("ubud.pmtiles",window.location.href).href;

const protocol =
new pmtiles.Protocol();

maplibregl.addProtocol(
"pmtiles",
protocol.tile
);

const tileset =
new pmtiles.PMTiles(PMTILES_URL);

protocol.add(tileset);


/* =====================================
   MAPA
===================================== */

async function startMap(){

try{

const header =
await tileset.getHeader();

map =
new maplibregl.Map({

container:"map",

center:[
header.centerLon || 115.2625,
header.centerLat || -8.5105
],

zoom:15,

style:{

version:8,

sources:{

"ubud":{
type:"vector",
url:"pmtiles://"+PMTILES_URL
}

},

layers:[

{
id:"background",
type:"background",
paint:{
"background-color":"#f7f4ec"
}
},

{
id:"earth",
type:"fill",
source:"ubud",
"source-layer":"earth",
paint:{
"fill-color":"#e1ead8"
}
},
{
  id:"green-areas",
  type:"fill",
  source:"ubud",
  "source-layer":"landuse",
  filter:[
    "in",
    "kind",
    "park",
    "garden",
    "grass",
    "forest",
    "wood",
    "nature_reserve",
    "playground"
  ],
  paint:{
    "fill-color":[
      "match",
      ["get","kind"],
      "park", "#9fcf8f",
      "garden","#c7dfb5",
      "grass","#d2e5bd",
      "forest","#9fc58f",
      "wood","#a8ca98",
      "nature_reserve","#8fbd82",
      "playground","#c5dcae",
      "#c5dcae"
    ],
    "fill-opacity":0.70
  }
},
{
id:"landuse",
type:"fill",
source:"ubud",
"source-layer":"landuse",
paint:{
"fill-color":"#d4e3c9",
"fill-opacity":0.75
}
},


{
id:"water",
type:"fill",
source:"ubud",
"source-layer":"water",
paint:{
"fill-color": "#a9d8e8"
}
},

{
id:"buildings",
type:"fill",
source:"ubud",
"source-layer":"buildings",
paint:{
"fill-color":"#ddd8cf",
"fill-opacity":0.85
}
},

{
id:"roads",
type:"line",
source:"ubud",
"source-layer":"roads",
paint:{
"line-color":"#ffffff",
"line-width":[
"interpolate",
["linear"],
["zoom"],
10,0.5,
14,1.5,
17,4
]
}
},

{
id:"roads-main",
type:"line",
source:"ubud",
"source-layer":"roads",
paint:{
"line-color":"#c9aa72",
"line-width":[
"interpolate",
["linear"],
["zoom"],
10,1,
14,2,
17,5
]
}
},
{
  id:"road-labels",
  type:"symbol",
  source:"ubud",
  "source-layer":"roads",
  filter:["has","name"],
  layout:{
    "text-field":["get","name"],
    "text-size":12,
    "symbol-placement":"line",
    "text-rotation-alignment":"map",
    "text-allow-overlap":false
  },
  paint:{
    "text-color":"#55483c",
    "text-halo-color":"#ffffff",
    "text-halo-width":2
  }
},
]

}

});
window.map = map;
map.addControl(
new maplibregl.NavigationControl(),
"top-left"
);

map.on("load",()=>{

document.getElementById("loading").style.display="none";

addMarkers();

});

}catch(error){

console.error(error);

document.getElementById("loading").innerHTML=
"❌ Nie udało się załadować lokalnej mapy.";

}

}


/* =====================================
   GOOGLE MAPS
===================================== */

function googleMaps(place){

return "https://www.google.com/maps/dir/?api=1"
+"&destination="+place.lat+","+place.lon
+"&travelmode=walking";

}


/* =====================================
   MARKERY
===================================== */

function icon(place){

let border="#71816a";

if(place.id==="hotel")
border="#b79b6b";

if(place.id==="taman")
border="#b76b50";

return new maplibregl.Marker({

element:(()=>{

const el=document.createElement("div");



const cat = place.category;

let iconFile = place.icon || "mapa.png";

if(!place.icon){
  if(cat.includes("Baza")) iconFile = "nasza-baza.png";
  else if(cat.includes("Natura")) iconFile = "natura.png";
 else if(cat.includes("Świątynie")) iconFile = "swietynie.png";
  else if(cat.includes("Kultura")) iconFile = "kultura.png";
  else if(cat.includes("Sztuka")) iconFile = "sztuka.png";
  else if(cat.includes("Zakupy")) iconFile = "zakupy.png";
}

el.innerHTML = `<img src="bali_icons/${iconFile}" style="width:32px;height:32px;object-fit:contain;">`;
el.title = place.name;
el.style.width="40px";
el.style.height="40px";

el.style.width="40px";
el.style.height="40px";
el.style.borderRadius="50%";
el.style.background="#fffaf3";
el.style.border="3px solid "+border;
el.style.display="flex";
el.style.alignItems="center";
el.style.justifyContent="center";
el.style.fontSize="20px";
el.style.boxShadow="0 3px 10px #55483c55";

return el;

})()

});

}


function popup(place){

const el=document.createElement("div");

el.style.minWidth="210px";

el.innerHTML=`

<h3>${place.emoji} ${place.name}</h3>

<div style="
color:#71816a;
font-size:11px;
margin-bottom:8px;
">
${place.category}
</div>

<p style="
font-size:12px;
line-height:1.45;
">
${place.desc}
</p>

<div style="
color:#71816a;
font-weight:bold;
font-size:12px;
">
🚶 ${place.walk}
</div>

<a
href="${googleMaps(place)}"
target="_blank"
style="
display:block;
text-align:center;
margin-top:10px;
padding:9px;
border-radius:10px;
background:#71816a;
color:white;
text-decoration:none;
font-size:12px;
">

🧭 Prowadź mnie w Google Maps

</a>

`;

return el;

}


function addMarkers(){

  if(!map)return;

  Object.values(markers).forEach(
    marker => marker.remove()
  );

  markers = {};

  const sharedPopup = new maplibregl.Popup({
    offset: 25,
    closeOnClick: true
  });

  places
    .filter(p =>
      activeCategory === "Wszystko" ||
      p.category.includes(activeCategory)
    )
    .forEach(place => {

      const marker = icon(place)
        .setLngLat([
          place.lon,
          place.lat
        ])
        .addTo(map);

      marker.getElement().title = place.name;

      marker.getElement().addEventListener("click", () => {

    document.querySelectorAll(".maplibregl-popup").forEach(p => p.remove());

    sharedPopup
        .setLngLat([
            place.lon,
            place.lat
        ])
        .setDOMContent(
            popup(place)
        )
        .addTo(map);

});
}
/* =====================================
   FILTRY
===================================== */

function createFilters(){

const box =
document.getElementById("filters");

box.innerHTML = "";

Object.keys(categories)
.forEach(category => {

const button =
document.createElement("button");

const iconFiles = {
  "Wszystko": "mapa.png",
  "Baza": "nasza-baza.png",
  "Natura": "natura.png",
  "Świątynie": "swietynie.png",
  "Kultura": "kultura.png",
  "Sztuka": "sztuka.png",
  "Zakupy": "zakupy.png"
};

const iconFile = iconFiles[category];

button.innerHTML =
  `<img src="bali_icons/${iconFile}" class="category-icon">`;

button.onclick = () => {

activeCategory = category;

createFilters();
addMarkers();
renderCards();

};

box.appendChild(button);

});

}

/* =====================================
   KARTY
===================================== */

function renderCards(){

const box=
document.getElementById("cards");

box.innerHTML="";

places
.filter(p=>
activeCategory==="Wszystko" ||
p.category.includes(activeCategory)
)
.forEach(place=>{

const card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="card-head">

<img src="bali_icons/${place.icon ? place.icon :
place.category.includes("Baza") ? "nasza-baza.png" :
place.category.includes("Natura") ? "natura.png" :
place.category.includes("Świątynie") ? "swietynie.png" :
place.category.includes("Kultura") ? "kultura.png" :
place.category.includes("Sztuka") ? "sztuka.png" :
place.category.includes("Zakupy") ? "zakupy.png" :
"mapa.png"}" class="category-icon">


<div class="name">
${place.name}
</div>



</div>

</div>

<div class="description">
${place.desc}
</div>

<div class="walk">
🚶 ${place.walk}
</div>

<div class="buttons">

<button
class="show"
onclick="showPlace('${place.id}')">

Pokaż na mapie

</button>

<a
class="navigate"
href="${googleMaps(place)}"
target="_blank">

Nawiguj →

</a>

</div>

`;

box.appendChild(card);

});

}


/* =====================================
   POKAŻ MIEJSCE
===================================== */

function showPlace(id){

const place=
places.find(p=>p.id===id);

if(!place || !map)return;

map.flyTo({

center:[
place.lon,
place.lat
],

zoom:16

});

if(markers[id])
markers[id].togglePopup();

document.getElementById("map")
.scrollIntoView({

behavior:"smooth",
block:"center"

});

}


/* =====================================
   GPS
===================================== */

function findMe(){

if(!navigator.geolocation){

alert(
"Twoja przeglądarka nie obsługuje GPS."
);

return;

}

navigator.geolocation.getCurrentPosition(

position=>{

const lat=
position.coords.latitude;

const lon=
position.coords.longitude;

if(myLocationMarker)
myLocationMarker.remove();

const el=
document.createElement("div");

el.innerHTML="📍";

el.style.fontSize="30px";

myLocationMarker=
new maplibregl.Marker({
element:el
})
.setLngLat([lon,lat])
.setPopup(
new maplibregl.Popup()
.setText("📍 Twoja aktualna lokalizacja")
)
.addTo(map);

map.flyTo({

center:[lon,lat],
zoom:16

});

},

()=>{

alert(
"Nie udało się pobrać lokalizacji. Sprawdź, czy GPS jest włączony."
);

},

{

enableHighAccuracy:true,
timeout:15000,
maximumAge:0

}

);

}


/* =====================================
   START
===================================== */

createFilters();

renderCards();

startMap();

</script>

</body>
</html>
